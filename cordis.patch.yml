# dsh-rerun-turn bundle patch: inserts the plugin row into the profile roster.
#
# The node half serves the loopback-only /dsh-rerun-turn/* routes and owns the
# shadow-prompt-replay rerun service; the browser half (exports "./client")
# mounts the per-reply rerun action and hides the rows a rerun retired.
#
# The entry name is the BARE package name on purpose: the client-module scanner
# treats it as a package specifier and resolves `<name>/package.json`, so a
# subpath entry would be cached as "not a client package" and the browser half
# would silently never load.
- insert:
    - id: dsh-rerun-turn
      name: 'dsh-rerun-turn'
